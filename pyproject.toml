[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-image-mlx"
version = "0.1.0a4"
description = "Local MiniMax H3 Image generation and editing with MLX on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "src/h3_image_mlx/kernels/LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mlx>=0.32.3,<0.33", "numpy>=1.26", "Pillow>=10", "tokenizers>=0.21,<0.24", "httpx>=0.27,<1"]

[project.urls]
Source = "https://github.com/Anionex/h3-image-mlx"
Issues = "https://github.com/Anionex/h3-image-mlx/issues"

[project.scripts]
h3-image-mlx = "h3_image_mlx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
h3_image_mlx = ["kernels/*.metal", "kernels/LICENSE", "weights.json", "weights-bf16.json", "MODEL_LICENSE.txt", "NOTICE.txt"]

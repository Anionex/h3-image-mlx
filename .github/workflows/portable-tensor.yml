name: H3 direct integer TensorOps
on:
  push:
    branches: [perf/portable-metal4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integer-metal:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: |
          python -c 'import mlx.core as mx; from h3_image_mlx._portable import _has_integer_tensor_ops; print(mx.device_info()); assert _has_integer_tensor_ops()'
          python -m unittest discover -s tests -p test_portable.py -v
          git archive d8fab94 src/h3_image_mlx | tar -x -C "$RUNNER_TEMP"
          python scripts/bench_portable.py "$RUNNER_TEMP/src/h3_image_mlx/_portable.py"
          df -h "$RUNNER_TEMP"

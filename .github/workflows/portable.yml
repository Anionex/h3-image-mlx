name: H3 legacy Metal full render on hosted macOS
on: workflow_dispatch
permissions:
  contents: read
jobs:
  render:
    runs-on: macos-15
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'mlx==0.32.4' 'h3-image-mlx==0.1.0a8'
      - name: Verify macOS, GPU, disk counters and target geometry
        run: |
          python - <<'PY'
          import os, platform, sys
          import mlx.core as mx
          sys.path.insert(0,'scripts/legacy_bench')
          from cache_stats import disk_bytes
          import subprocess
          cpu=subprocess.check_output(['sysctl','-n','machdep.cpu.brand_string'],text=True).strip()
          print(cpu,platform.mac_ver()[0],mx.device_info(),disk_bytes(),flush=True)
          assert 'Apple M1' in cpu and tuple(map(int,platform.mac_ver()[0].split('.')[:2]))<(26,4)
          assert mx.metal.is_available() and disk_bytes()>0
          PY
          PYTHONPATH=src:tests python -m unittest test_portable.PortableProjectionTests.test_certified_full_and_multiple_spans
      - name: Make space on the temporary runner and fetch pinned weights
        timeout-minutes: 35
        run: |
          python scripts/legacy_bench/fetch.py "$RUNNER_TEMP/h3-models"
          clang -O2 -dynamiclib scripts/legacy_bench/io.c -o scripts/legacy_bench/audit.dylib
          sudo -n purge
      - name: Run same-machine paired 1024px trials
        run: python scripts/legacy_bench/compare.py --candidate . --weights "$RUNNER_TEMP/h3-models" --results results --pairs 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos15-m1-1024-raw
          path: results/
          if-no-files-found: warn
          retention-days: 14

name: H3 portable projection
on:
  pull_request:
    paths:
      - src/h3_image_mlx/**
      - scripts/bench_portable.py
      - tests/test_portable.py
      - .github/workflows/portable.yml
  push:
    branches: [main]
    paths:
      - src/h3_image_mlx/**
      - scripts/bench_portable.py
      - tests/test_portable.py
      - .github/workflows/portable.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - name: Test the portable operator against integer reference results
        run: |
          python - <<'PY'
          import unittest
          import mlx.core as mx

          device = mx.gpu if mx.metal.is_available() else mx.cpu
          mx.set_default_device(device)
          print(f"Testing with MLX device {device}", flush=True)
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_portable.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Compare projection latency with the PR base on Metal
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if python -c 'import mlx.core as mx; raise SystemExit(not mx.metal.is_available())'; then
            git show "$BASE:src/h3_image_mlx/_portable.py" > "$RUNNER_TEMP/baseline.py"
            python scripts/bench_portable.py "$RUNNER_TEMP/baseline.py"
          fi

name: H3 portable projection
on:
  pull_request:
    paths:
      - src/h3_image_mlx/**
      - tests/test_portable.py
      - .github/workflows/portable.yml
  push:
    branches: [main]
    paths:
      - src/h3_image_mlx/**
      - tests/test_portable.py
      - .github/workflows/portable.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - name: Test the portable operator against integer reference results
        run: |
          python - <<'PY'
          import unittest
          import mlx.core as mx

          device = mx.gpu if mx.metal.is_available() else mx.cpu
          mx.set_default_device(device)
          print(f"Testing with MLX device {device}", flush=True)
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_portable.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY

name: Explore wide portable GEMM
on:
  push:
    branches: [perf/portable-wide-projections]
permissions:
  contents: read
jobs:
  projection:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - run: python scripts/probe_exact.py
